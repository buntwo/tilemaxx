services:
  tilemaxx:
    image: tilemaxx:local
    # Uncomment to build from this checkout instead of using a prebuilt image.
    # build: .
    container_name: ${TILEMAXX_CONTAINER_NAME:-tilemaxx-1}
    ports:
      - "${TILEMAXX_PORT:-4173}:4173"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data

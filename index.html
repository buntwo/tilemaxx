<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#184f41" />
    <meta
      name="description"
      content="Your personal word game companion. Find your next move, save your games, and pick up on any device."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tilemaxx — find your next move</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("tilewise:theme") || "system";
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

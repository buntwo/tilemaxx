<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#184f41" />
    <meta
      name="description"
      content="Your personal word game companion. Find your next move, save your games, and pick up on any device."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tilemaxx — find your next move</title>
    <script>
      let theme = "dark";
      try {
        theme = localStorage.getItem("tilemaxx:theme") ||
          (localStorage.getItem("tilewise:theme") === "light" ? "light" : "dark");
      } catch {}
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

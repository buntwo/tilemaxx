services:
  tilewise:
    build: .
    image: tilewise:local
    ports:
      - "${TILEMAXX_PORT:-4173}:4173"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
